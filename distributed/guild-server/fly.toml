app = "openmu-guild"
primary_region = "mia"

[build]
  dockerfile = "Dockerfile"

[env]
  APP_ID = "guildServer"
  ASPNETCORE_URLS = "http://+:8080"

[[services]]
  protocol = "tcp"
  internal_port = 8080
  processes = ["app"]

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true
