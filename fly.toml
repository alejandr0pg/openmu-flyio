app = "lara-mu"
primary_region = "dfw"

[build]
  dockerfile = "Dockerfile"

[deploy]
  wait_timeout = "15m"

# Admin Panel + Registration API via Caddy (HTTP)
[[services]]
  internal_port = 8080
  protocol = "tcp"

  [[services.ports]]
    port = 80
    handlers = ["http"]

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [services.concurrency]
    type = "connections"
    hard_limit = 100
    soft_limit = 80

  [[services.http_checks]]
    interval = 15000
    grace_period = "15m"
    method = "GET"
    path = "/health"
    protocol = "http"
    timeout = 5000

# Connect Server (TCP)
[[services]]
  internal_port = 44405
  protocol = "tcp"

  [[services.ports]]
    port = 44405

  [[services.tcp_checks]]
    grace_period = "5m"
    interval = 15000
    timeout = 5000

# Game Server 0 - GMO Client (TCP)
[[services]]
  internal_port = 55901
  protocol = "tcp"

  [[services.ports]]
    port = 55901

  [[services.tcp_checks]]
    grace_period = "5m"
    interval = 15000
    timeout = 5000

# Game Server 0 - Open Source Client (TCP)
[[services]]
  internal_port = 55902
  protocol = "tcp"

  [[services.ports]]
    port = 55902

  [[services.tcp_checks]]
    grace_period = "5m"
    interval = 15000
    timeout = 5000


# Chat Server (TCP)
[[services]]
  internal_port = 55980
  protocol = "tcp"

  [[services.ports]]
    port = 55980

  [[services.tcp_checks]]
    grace_period = "5m"
    interval = 15000
    timeout = 5000

[[vm]]
  size = "shared-cpu-4x"
  memory = "2gb"
