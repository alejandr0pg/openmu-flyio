app = "lara-mu"
primary_region = "dfw"

[build]
  dockerfile = "Dockerfile"

# Admin Panel + Registration API via Caddy (HTTP)
[[services]]
  internal_port = 8080
  protocol = "tcp"

  [[services.ports]]
    port = 80
    handlers = ["http"]

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [services.concurrency]
    type = "connections"
    hard_limit = 100
    soft_limit = 80

  [[services.http_checks]]
    interval = 15000
    grace_period = "10m"
    method = "GET"
    path = "/health"
    protocol = "http"
    timeout = 5000

# Connect Server (TCP)
[[services]]
  internal_port = 44405
  protocol = "tcp"

  [[services.ports]]
    port = 44405

  [[services.tcp_checks]]
    interval = 15000
    timeout = 5000
    grace_period = "10m"

# Game Server 0 - GMO Client (TCP)
[[services]]
  internal_port = 55901
  protocol = "tcp"

  [[services.ports]]
    port = 55901

  [[services.tcp_checks]]
    interval = 15000
    timeout = 5000
    grace_period = "10m"

# Game Server 0 - Open Source Client (TCP)
[[services]]
  internal_port = 55902
  protocol = "tcp"

  [[services.ports]]
    port = 55902

# Game Server 1 - GMO Client (TCP)
[[services]]
  internal_port = 55903
  protocol = "tcp"

  [[services.ports]]
    port = 55903

# Game Server 1 - Open Source Client (TCP)
[[services]]
  internal_port = 55904
  protocol = "tcp"

  [[services.ports]]
    port = 55904

# Game Server 2 - GMO Client (TCP)
[[services]]
  internal_port = 55905
  protocol = "tcp"

  [[services.ports]]
    port = 55905

# Game Server 2 - Open Source Client (TCP)
[[services]]
  internal_port = 55906
  protocol = "tcp"

  [[services.ports]]
    port = 55906

# Chat Server (TCP)
[[services]]
  internal_port = 55980
  protocol = "tcp"

  [[services.ports]]
    port = 55980

  [[services.tcp_checks]]
    interval = 15000
    timeout = 5000
    grace_period = "10m"

[[vm]]
  size = "shared-cpu-4x"
  memory = "2gb"
